name: Conditional

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs: 
    trigger:
        runs-on: ubuntu-latest
        steps:
            - name: workflow run
              if: github.ref == 'main'
              run: echo "workflow is running on branch main"

    fail:
        runs-on: ubuntu-latest
        steps: 
            - name: failed step
              run: exit 1

            - name: Run on failure
              if: failure()
              run: echo "This step is running because the previous step is failed"
    
    push-event:
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        steps:
            - name: Run code
              run: echo "This only deploys or runs on an actual push!"

            - name: continue
              continue-on-error: true
              run: sudo apt-get update && sudo apt-get install -y python3