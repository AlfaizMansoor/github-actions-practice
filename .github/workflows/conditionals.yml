name: Conditional

on:
    workflow_dispatch:

jobs: 
    trigger:
        runs-on: ubuntu-latest
        steps:
            - name: workflow run
              if: github.ref == 'main'
              run: echo "workflow is running on branch main"

    fail:
        runs-on: ubuntu-latest
        steps: 
            - name: failed step
              run: exit 1

            - name: Run on failure
              if: failure()
              run: echo "This step is running because the previous step is failed"
