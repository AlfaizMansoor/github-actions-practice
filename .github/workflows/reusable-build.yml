name: workflow reusable

on:
    workflow_call:
        inputs:
            app-name:
                type: string
                required: true
            environment: 
                description: "Describe environment"
                type: string
                default: "staging"
                required: true
        secrets:
            docker_token: 
                required: true

jobs: 
    Building:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: print app name
              run: echo "Building ${{inputs.app-name}} for environment ${{inputs.environment}}"

            - name: Prints docker token
              run: echo "Docker token is set:true"