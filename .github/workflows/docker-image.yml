name: create docker image

on:
    push:
        branches: [main]

jobs:
    docker-build:
        runs-on: ubuntu-latest
        steps:
            - name: image build
              uses: actions/checkout@v4

            - name: docker build
              run: |
                docker build -t my-app .
                docker run -d -p 5000:5000 my-app my-app 

            - name: check running images
              run: docker ps
