name: workflow run

on: 
    push:
        branches: [main]

jobs: 
    build:
        uses: ./.github/workflows/reusable-build.yml
        with:
            app-name: "my-web-app"
            environment: "production"
        secrets:
            docker_token: ${{ secrets.DOCKER_TOKEN }}

    version:
        needs: [build]
        runs-on: ubuntu-latest
        steps:    
           - name: print version
             run: echo "The built version is ${{ needs.build.outputs.build_version }}"
